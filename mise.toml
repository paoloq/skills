min_version = "2026.10.8"

[settings]
lockfile = true

[env]
# Python on Windows writes pipes in the locale encoding unless UTF-8 mode is on
PYTHONUTF8 = "1"
# read by mise-tasks/check/skills; an empty value turns the rule off
SKILL_PREFIX = "pq-"
SKILL_INVOCATION_KEY = "disable-model-invocation"

[tools]
uv = "0.13"
hk = "2.6.0"
claude-code = "2.1.296"
jactionlint = "2.1.0"

[tasks.check]
description = "Run every check that CI runs"
depends = ["check:*"]

[tasks."check:lint"]
description = "Run the hk linters on every file"
run = "hk check --all"
