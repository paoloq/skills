min_version = "2026.10.7"

[settings]
lockfile = true

# read by mise-tasks/check/skills; an empty value turns the rule off
[env]
SKILL_PREFIX = "pq-"
SKILL_INVOCATION_KEY = "disable-model-invocation"

[tools]
uv = "0.13"
hk = "2.5.0"
claude-code = "2.1.296"
jactionlint = "2.1.0"

[tasks.check]
description = "Run every check that CI runs"
depends = ["check:*"]

[tasks."check:workflows"]
description = "Lint the GitHub Actions workflows"
run = "jactionlint"
